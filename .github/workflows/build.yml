name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubicloud-standard-8
          - name: linux-arm64
            runner: ubicloud-standard-8-arm
          - name: macos-arm64
            runner: macos-26
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        run: |
          source bazel/versions.bzl
          test "$GITHUB_REF_NAME" = "v$XMOJO_VERSION"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config
      - name: Set up source dependencies
        run: tools/setup_source_deps.sh
      - name: Build wheel
        env:
          BBUDDY_API_KEY: ${{ secrets.BBUDDY_API_KEY }}
          BB_DISABLE_SIDECAR: 1
          XMOJO_PUBLIC_CACHE: 1
        run: tools/build_wheel.sh
      - name: Check manylinux compatibility
        if: runner.os == 'Linux'
        run: uv tool run auditwheel show dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
