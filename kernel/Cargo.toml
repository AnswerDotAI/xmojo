[package]
name = "xmojo-kernel"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

[lib]
name = "xmojo_kernel"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
async-trait = "0.1"
kernmini = "0.1.23"
serde_json = "1"

[profile.release]
panic = "abort"
